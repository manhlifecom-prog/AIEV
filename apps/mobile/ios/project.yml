name: AIEVStudio
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  AIEVStudio:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: [native-bridge.js]
      - path: Sources/native-bridge.js
        buildPhase: resources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: marketing.manh.aiev
        PRODUCT_NAME: AIEV Studio
        PRODUCT_MODULE_NAME: AIEVStudio
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "6"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: AIEV Studio
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSSupportsOpeningDocumentsInPlace: true
  AIEVStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: AIEVStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: marketing.manh.aiev.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AIEVStudio:
    build:
      targets:
        AIEVStudio: all
    test:
      targets: [AIEVStudioTests]
